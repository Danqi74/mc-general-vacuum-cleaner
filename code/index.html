<!DOCTYPE HTML>
<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin: 0px auto;
            padding-top: 30px;
        }

        .h1 {
            text-align: center;
            width: 100%;
        }

        .button {
            padding: 10px 20px;
            font-size: 24px;
            text-align: center;
            outline: none;
            color: #fff;
            background-color: #4d9441;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            min-width: 137px;
        }

        .button:hover {
            background-color: #45843a
        }

        .button:active {
            transform: translateY(2px);
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            width: max-content;
            margin: auto;
        }

        .button:nth-child(1) {
            grid-column: 2;
            grid-row: 1;
        }

        /* FORWARD */
        .button:nth-child(2) {
            grid-column: 2;
            grid-row: 3;
        }

        /* BACKWARD */
        .button:nth-child(3) {
            grid-column: 3;
            grid-row: 2;
        }

        /* RIGHT */
        .button:nth-child(4) {
            grid-column: 1;
            grid-row: 2;
        }

        /* LEFT */
        .button:nth-child(5) {
            grid-column: 2;
            grid-row: 2;
        }

        /* STOP */
        .indicator {
            width: 30px;
            height: 30px;
            background-color: red; /* Початковий колір */
            border-radius: 50%;
            border: 3px solid #ccc;
            transition: background-color 0.3s ease, border-color 0.3s ease;
            margin-top: 5px;
        }
        .clean-control {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 15px;
            padding: 40px;
            background: white;
            border-radius: 12px;
            width: max-content;
            margin: auto;
        }

        /* Контейнер для кнопок */
        .button-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-evenly;
            gap: 15px;
            width: 100%;
        }

        /* Контейнер для індикаторів */
        .indicator-container {
            display: flex;
            justify-content: space-evenly;
            gap: 30px;
            width: 100%;
            margin-top: 10px;
        }
        canvas {
            border: 1px solid #333;
        }

    </style>
</head>

<body>
    <h1>GENERAL SUCKER</h1>

    
    <div class="clean-control">
        <div class="button-container">
            <button class="button" onClick="runCommandSwitch('clean');">CLEAN</button>
        </div>
        <div class="indicator-container">
            <div class="indicator" id="clean-indc"></div>
        </div>
    </div>
    <div class="map-container">
        <canvas id="map" width="800" height="600"></canvas>
    </div>
    <div class="buttons">
        <button class="button" onClick="runCommand('forward');">FORWARD</button>
        <button class="button" onClick="runCommand('backward');">BACKWARD</button>
        <button class="button" onClick="runCommand('right');">RIGHT</button>
        <button class="button" onClick="runCommand('left');">LEFT</button>
        <button class="button" onClick="runCommand('stop');">STOP</button>
    </div>
    <div class="clean-control">
        <div class="button-container">
            <button class="button" onClick="runCommandSwitch('fan');" id="fan-indc" style="background-color: red;">FAN</button>
            <button class="button" onClick="runCommandSwitch('brush');" id="brush-indc" style="background-color: red;">BRUSH</button>
        </div>
    </div>
    <br>
    <h2>DEV data</h2>
    <br>
    <h2>Accelerometer</h2>
    X: <span id="ax">---</span><br>
    Y: <span id="ay">---</span><br>
    Z: <span id="az">---</span><br><br>
    <h2>Gyroscope</h2>
    X: <span id="gx">---</span><br>
    Y: <span id="gy">---</span><br>
    Z: <span id="gz">---</span><br>
    <h2>Triggers</h2>
    Left: <span id="leftTrigg">---</span><br>
    Right: <span id="rightTrigg">---</span><br>
    <script>
        function runCommand(x) {
            var xhr = new XMLHttpRequest();
            xhr.open("GET", "/" + x, true);
            xhr.send();
        }

        function runCommandSwitch(x) {
            var xhr = new XMLHttpRequest();
            xhr.open("GET", "/" + x, true);
            xhr.send();

            var indicator = document.getElementById(x + "-indc");

            if (indicator.style.backgroundColor === "green") {
                indicator.style.backgroundColor = "red";
            } else {
                indicator.style.backgroundColor = "green";
            }
        }
            function fetchData() {
    fetch("/data")
        .then(response => response.json())
        .then(data => {
            document.getElementById("ax").textContent = data.ax;
            document.getElementById("ay").textContent = data.ay;
            document.getElementById("az").textContent = data.az;
            document.getElementById("gx").textContent = data.gx;
            document.getElementById("gy").textContent = data.gy;
            document.getElementById("gz").textContent = data.gz;
            document.getElementById("leftTrigg").textContent = data.leftTrigg;
            document.getElementById("rightTrigg").textContent = data.rightTrigg;
            setIndicatorColor("fan-indc", data.fan);
            setIndicatorColor("brush-indc", data.brush);
            setIndicatorColor("clean-indc", data.clean);

            // 👉 Фільтрація та оновлення координат ТУТ
            const dx = kfX.filter(data.gx / 131); // гіроскоп X
            const dy = kfY.filter(data.gy / 131); // гіроскоп Y

            posX += dx;
            posY += dy;

            // Межі
            posX = Math.max(0, Math.min(canvas.width, posX));
            posY = Math.max(0, Math.min(canvas.height, posY));

            drawPoint(posX, posY);
        })
        .catch(error => {
            console.error("Error fetching data:", error);
        });
        }


        function setIndicatorColor(id, value) {
            const element = document.getElementById(id);
            if (!element) return;

            if (value === 1 || value === true) {
                element.style.backgroundColor = "green";
            } else {
                element.style.backgroundColor = "red";
            }
        }
        
        const canvas = document.getElementById("map");
        const ctx = canvas.getContext("2d");

        let posX = canvas.width / 2;
        let posY = canvas.height / 2;

        class KalmanFilter {
        constructor(R, Q) {
            this.R = R; // noise
            this.Q = Q; // process variance
            this.A = 1;
            this.B = 0;
            this.C = 1;
            this.cov = NaN;
            this.x = NaN;
        }

        filter(z) {
            if (isNaN(this.x)) {
            this.x = (1 / this.C) * z;
            this.cov = (1 / this.C) * this.Q * (1 / this.C);
            } else {
            const predX = (this.A * this.x);
            const predCov = ((this.A * this.cov) * this.A) + this.Q;

            const K = predCov * this.C * (1 / ((this.C * predCov * this.C) + this.R));
            this.x = predX + K * (z - (this.C * predX));
            this.cov = predCov - (K * this.C * predCov);
            }
            return this.x;
        }
        }

        const kfX = new KalmanFilter(0.5, 0.1);
        const kfY = new KalmanFilter(0.5, 0.1);

        function drawPoint(x, y) {
        ctx.fillStyle = "#0077ff";
        ctx.beginPath();
        ctx.arc(x, y, 3, 0, Math.PI * 2);
        ctx.fill();
        }

        setInterval(fetchData, 500);
        window.onload = fetchData;
        </script>
</body>

</html></html>
